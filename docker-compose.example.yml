version: '3.8'

services:
  cobalt-api:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt-api
    init: true
    restart: unless-stopped
    environment:
      # Bu adresi kendi domain'inizle değiştirin
      # İndirme linkleri bu URL'ye göre oluşturulur
      - API_URL=https://your-domain.example/
      - API_PORT=9000
    # İsteğe bağlı: cobalt API'nin portunu dış dünyaya açmak istiyorsanız
    # ports:
    #   - "9000:9000"

  # YouTube için ayrı bir extraction servisi — cobalt'ın kendi YouTube desteği
  # PO-token eksikliği yüzünden güvenilir değil (bkz. README "YouTube Desteği").
  # İsteğe bağlı değil — YouTube linkleri bu servis olmadan çalışmaz; diğer
  # platformlar (TikTok/Instagram/vb.) yalnız cobalt-api ile çalışmaya devam eder.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: pot-provider
    restart: unless-stopped

  ytdlp-service:
    build:
      context: ./ytdlp-service
    container_name: ytdlp-service
    restart: unless-stopped
    depends_on:
      - pot-provider
    environment:
      - POT_PROVIDER_URL=http://pot-provider:4416
    env_file:
      - ./ytdlp-service/.env

  cobalt-web-ui:
    image: node:20-alpine
    container_name: cobalt-web-ui
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - cobalt-api
      - ytdlp-service
    ports:
      - "8081:80"
    environment:
      - NODE_ENV=production
      - PORT=80
      # Docker Compose ağı içinde cobalt-api'ye/ytdlp-service'e iç adresle erişilir
      - COBALT_API=http://cobalt-api:9000
      - YTDLP_API=http://ytdlp-service:5000
    # AdSense ayarları .env dosyasından okunur (bkz. .env.example). Boş bırakılırsa
    # reklamlar hiç yüklenmez, alanlar placeholder olarak kalır.
    env_file:
      - .env
    volumes:
      # Projenin tamamını read-only olarak container'a monte et
      - ./:/app:ro
    command: node server.js
