
volumes:
  mitm-ca:

services:
  cobalt-api:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt-api
    init: true
    restart: unless-stopped
    environment:
      # Bu adresi kendi domain'inizle değiştirin
      # İndirme linkleri bu URL'ye göre oluşturulur
      - API_URL=https://your-domain.example/
      - API_PORT=9000
    # İsteğe bağlı: cobalt API'nin portunu dış dünyaya açmak istiyorsanız
    # ports:
    #   - "9000:9000"

  # PO Token (Proof-of-Origin) sağlayıcı — yt-dlp'nin YouTube'a "gerçek tarayıcı"
  # olduğunu kanıtlaması için token üretir.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: pot-provider
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 256m

  # YouTube çözümleme & gerçek zamanlı remux servisi (Python/yt-dlp)
  ytdlp-service:
    build:
      context: ./ytdlp-service
    container_name: ytdlp-service
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 1g
    depends_on:
      - pot-provider
    environment:
      - POT_PROVIDER_URL=http://pot-provider:4416
    env_file:
      - ./ytdlp-service/.env
    volumes:
      - mitm-ca:/app/.mitmproxy
      - ./ytdlp-service/cookies:/app/cookies:ro

  cobalt-web-ui:
    image: node:20-alpine
    container_name: cobalt-web-ui
    restart: unless-stopped
    working_dir: /app
    mem_limit: 64m
    memswap_limit: 128m
    depends_on:
      - cobalt-api
      - ytdlp-service
    ports:
      - "8081:80"
    environment:
      - NODE_ENV=production
      - PORT=80
      # Docker Compose ağı içinde cobalt-api'ye ve ytdlp-service'e iç adresle erişilir
      - COBALT_API=http://cobalt-api:9000
      - YTDLP_API=http://ytdlp-service:5000
    # AdSense ayarları .env dosyasından okunur (bkz. .env.example). Boş bırakılırsa
    # reklamlar yüklenmez, alanlar temiz ve gizli kalır.
    env_file:
      - .env
    volumes:
      - ./:/app:ro
    command: node server.js
