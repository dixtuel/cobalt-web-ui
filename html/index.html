<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cobalt — Medya İndirici</title>
  <meta name="description" content="YouTube, TikTok, Instagram, Twitter/X, Reddit ve diğer platformlardan filigransız ve hızlı medya indirme aracı.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Google AdSense: gerçek yayıncı kimliğiniz elinize geçince ca-pub-XXXXXXXXXXXXXXXX değerini
       kendi AdSense client ID'nizle değiştirip bu script etiketinin yorumunu kaldırın. -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->
</head>
<body>
  <div class="app-wrapper">
    <header class="app-header">
      <div class="brand">
        <div class="element-tile" aria-hidden="true">
          <span class="z">27</span>
          <span class="sym">Co</span>
          <span class="name">Kobalt</span>
        </div>
        <div class="brand-text">
          <h1>cobalt</h1>
          <span class="tagline">medya indirici</span>
        </div>
      </div>
      <div class="header-status">
        <span class="status-dot"></span>
        <span class="status-label" id="backendStatus">Bağlı</span>
      </div>
    </header>

    <main class="main-content">
      <section class="downloader-card">
        <form id="downloadForm" class="download-form" onsubmit="return false;">
          <div class="input-container">
            <div class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
            </div>
            <input
              type="url"
              id="urlInput"
              placeholder="TikTok, Instagram, YouTube veya Twitter bağlantısını yapıştırın..."
              required
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" id="pasteBtn" class="btn-paste" title="Panodan Yapıştır">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              </svg>
              <span>Yapıştır</span>
            </button>
            <button type="submit" id="submitBtn" class="btn-submit">
              <span class="btn-text">İndir</span>
              <div class="spinner" id="btnSpinner"></div>
            </button>
          </div>
        </form>

        <!-- Quick Settings & Filters -->
        <div class="controls-panel">
          <div class="mode-selector">
            <button type="button" class="mode-btn active" data-mode="auto" id="modeVideo">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
              <span>Video (MP4)</span>
            </button>
            <button type="button" class="mode-btn" data-mode="photo" id="modePhoto">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <span>Fotoğraf / Galeri</span>
            </button>
            <button type="button" class="mode-btn" data-mode="audio" id="modeAudio">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
              </svg>
              <span>Ses (MP3)</span>
            </button>
          </div>

          <div class="options-row">
            <div class="option-item" id="qualityWrapper">
              <label for="qualitySelect">Video Kalitesi</label>
              <select id="qualitySelect">
                <option value="max" selected>En Yüksek (Max)</option>
                <option value="1080">1080p Full HD</option>
                <option value="720">720p HD</option>
                <option value="480">480p SD</option>
                <option value="360">360p Düşük</option>
              </select>
            </div>

            <div class="option-item" id="photoQualityWrapper" style="display: none;">
              <label for="photoQualitySelect">Fotoğraf Kalitesi</label>
              <select id="photoQualitySelect">
                <option value="original" selected>Orijinal Çözünürlük (En Yüksek)</option>
              </select>
            </div>

            <div class="option-item" id="audioFormatWrapper" style="display: none;">
              <label for="audioFormatSelect">Ses Formatı</label>
              <select id="audioFormatSelect">
                <option value="mp3" selected>MP3 (Önerilen)</option>
                <option value="best">En İyi Orijinal</option>
                <option value="ogg">OGG</option>
                <option value="wav">WAV (Kayıpsız)</option>
                <option value="opus">Opus</option>
              </select>
            </div>

            <div class="option-item" id="codecWrapper">
              <label for="codecSelect">YouTube Kodek</label>
              <select id="codecSelect">
                <option value="h264" selected>H.264 (Evrensel MP4)</option>
                <option value="av1">AV1</option>
                <option value="vp9">VP9</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Result Container -->
        <div id="resultContainer" class="result-container" style="display: none;"></div>

        <!-- Platform tags -->
        <div class="supported-services">
          <span class="service-pill">TikTok Video / Foto</span>
          <span class="service-pill">Instagram Post / Reels / Galeri</span>
          <span class="service-pill">YouTube</span>
          <span class="service-pill">Twitter / X Medya</span>
          <span class="service-pill">Reddit</span>
          <span class="service-pill">Pinterest</span>
          <span class="service-pill">SoundCloud</span>
        </div>
      </section>

      <!-- Google AdSense display slot. Replace data-ad-client / data-ad-slot with your own
           values once your AdSense account is approved, then uncomment the <ins> block and
           call (adsbygoogle = window.adsbygoogle || []).push({}); -->
      <div class="ad-slot">
        <span class="ad-label">Reklam</span>
        <div class="ad-placeholder">
          Reklam alanı — AdSense yayıncı kimliği eklendiğinde burada gösterilir
        </div>
        <!--
        <ins class="adsbygoogle"
             style="display:block; width:100%;"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="XXXXXXXXXX"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        -->
      </div>
    </main>

    <footer class="app-footer">
      <span class="credit">made by <span class="maker">dixtuel</span></span>
      <nav class="footer-links">
        <a href="/privacy.html">Gizlilik Politikası</a>
        <span class="sep">·</span>
        <a href="/terms.html">Kullanım Şartları</a>
      </nav>
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
